name: vitra_radio
description: "Rádio pela internet com catálogo, temas e automação. Biblioteca privada no dispositivo."
publish_to: 'none'
version: 0.1.11+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.1
  crypto: ^3.0.7
  xml: ^7.0.1
  flutter_secure_storage: ^10.0.0
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/countries.json
    - assets/en.json
